<svg width="1600" height="960" viewBox="0 0 1600 960" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Mini Redis HashTable structure</title>
  <desc id="desc">Diagram showing Store, TTL metadata, HashTable buckets, and separate chaining nodes used in Mini Redis.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ef" />
      <stop offset="100%" stop-color="#f4f8ff" />
    </linearGradient>

    <linearGradient id="storePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff3e8" />
      <stop offset="100%" stop-color="#ffe6cf" />
    </linearGradient>

    <linearGradient id="tablePanel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#eef6ff" />
      <stop offset="100%" stop-color="#dcecff" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.10" />
    </filter>

    <marker id="arrowBlue" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0 0 L14 7 L0 14 Z" fill="#2563eb" />
    </marker>

    <marker id="arrowOrange" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0 0 L14 7 L0 14 Z" fill="#ea580c" />
    </marker>

    <style>
      .title { font: 700 38px "Segoe UI", Arial, sans-serif; fill: #132238; }
      .subtitle { font: 400 19px "Segoe UI", Arial, sans-serif; fill: #516072; }
      .panel-title { font: 700 28px "Segoe UI", Arial, sans-serif; fill: #132238; }
      .label { font: 600 18px "Segoe UI", Arial, sans-serif; fill: #223043; }
      .body { font: 400 17px "Segoe UI", Arial, sans-serif; fill: #556273; }
      .mono { font: 600 19px Consolas, "Courier New", monospace; fill: #132238; }
      .micro { font: 600 15px "Segoe UI", Arial, sans-serif; fill: #6b7280; letter-spacing: 0.08em; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)" />

  <rect x="40" y="40" width="1520" height="880" rx="34" fill="#fffdf9" stroke="#e5e7eb" stroke-width="2" filter="url(#shadow)" />

  <text x="90" y="120" class="title">Mini Redis HashTable Structure</text>
  <text x="90" y="156" class="subtitle">Store owns TTL policy. HashTable owns hashing, bucket layout, and collision chains.</text>

  <rect x="90" y="210" width="400" height="520" rx="30" fill="url(#storePanel)" stroke="#f59e0b" stroke-width="2.5" filter="url(#shadow)" />
  <text x="128" y="268" class="micro">Storage Layer</text>
  <text x="128" y="308" class="panel-title">Store</text>
  <text x="128" y="344" class="body">Coordinates commands, expiration checks, and access to the table.</text>

  <rect x="128" y="392" width="324" height="90" rx="22" fill="#fffdf9" stroke="#fdba74" stroke-width="2" />
  <text x="156" y="430" class="label">TTL metadata</text>
  <text x="156" y="462" class="mono">expire_at[key] -&gt; timestamp</text>

  <rect x="128" y="512" width="324" height="112" rx="22" fill="#fffdf9" stroke="#fdba74" stroke-width="2" />
  <text x="156" y="550" class="label">HashTable adapter</text>
  <text x="156" y="582" class="body">Routes read and write operations</text>
  <text x="156" y="608" class="body">to the bucket array below.</text>

  <rect x="128" y="652" width="324" height="48" rx="18" fill="#fff7ed" stroke="#fdba74" stroke-width="1.5" />
  <text x="156" y="683" class="body">Checks expiration before get / delete / exists</text>

  <rect x="560" y="210" width="950" height="620" rx="30" fill="url(#tablePanel)" stroke="#60a5fa" stroke-width="2.5" filter="url(#shadow)" />
  <text x="604" y="268" class="micro">Data Structure</text>
  <text x="604" y="308" class="panel-title">HashTable</text>
  <text x="604" y="344" class="body">FNV-1a hash picks a bucket. Collisions stay in the same bucket as a linked chain.</text>

  <rect x="604" y="392" width="194" height="74" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
  <text x="648" y="438" class="mono">bucket[0]</text>
  <rect x="850" y="392" width="308" height="74" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
  <text x="888" y="438" class="mono">HashNode(key-a, value-a)</text>

  <rect x="604" y="500" width="194" height="74" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
  <text x="648" y="546" class="mono">bucket[1]</text>
  <rect x="850" y="500" width="170" height="74" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="909" y="546" class="label">empty</text>

  <rect x="604" y="608" width="194" height="74" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
  <text x="648" y="654" class="mono">bucket[2]</text>
  <rect x="850" y="608" width="308" height="74" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
  <text x="888" y="654" class="mono">HashNode(key-b, value-b)</text>
  <rect x="1200" y="608" width="270" height="74" rx="20" fill="#ffffff" stroke="#60a5fa" stroke-width="2" />
  <text x="1238" y="654" class="mono">HashNode(key-c, value-c)</text>

  <rect x="604" y="716" width="194" height="74" rx="20" fill="#dbeafe" stroke="#60a5fa" stroke-width="2" />
  <text x="648" y="762" class="mono">bucket[3]</text>
  <rect x="850" y="716" width="170" height="74" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
  <text x="909" y="762" class="label">empty</text>

  <path d="M452 568 C500 568 510 568 560 568" fill="none" stroke="#ea580c" stroke-width="4" marker-end="url(#arrowOrange)" />
  <path d="M452 440 C525 440 540 440 604 440" fill="none" stroke="#ea580c" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrowOrange)" />

  <path d="M798 429 L850 429" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)" />
  <path d="M798 537 L850 537" fill="none" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrowBlue)" />
  <path d="M798 645 L850 645" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)" />
  <path d="M1158 645 L1200 645" fill="none" stroke="#2563eb" stroke-width="4" marker-end="url(#arrowBlue)" />
  <path d="M798 753 L850 753" fill="none" stroke="#94a3b8" stroke-width="4" marker-end="url(#arrowBlue)" />

  <rect x="90" y="860" width="1420" height="34" rx="17" fill="#eef2ff" />
  <text x="118" y="882" class="body">Key point: values live in HashTable buckets, while TTL lives outside the table so expiration rules stay separate from the data structure.</text>
</svg>
